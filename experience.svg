<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Experience timeline, January to April 2026: The Build Fellowship, Build Student Consultant, January to March; KayCore, Cybersecurity and Technical Support Specialist, January to April">
<style>
.grow { transform: scaleX(0); animation: grow 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes grow { to { transform: scaleX(1); } }
.shine { animation: shine 4.5s ease-in-out infinite; }
@keyframes shine { 0% { transform: translateX(0); } 60%,100% { transform: translateX(820px); } }
.glow { animation: glow 6s ease-in-out infinite; }
@keyframes glow { 0%,100% { opacity: .5; } 50% { opacity: .85; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transform: none !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e0420"/><stop offset=".6" stop-color="#1c0b3c"/><stop offset="1" stop-color="#2b1150"/></linearGradient>
  <radialGradient id="gl" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(700 120) scale(420 160)">
    <stop offset="0" stop-color="#b48cff" stop-opacity=".22"/><stop offset="1" stop-color="#b48cff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
  <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1000" height="230" rx="16" fill="url(#bg)"/>
<rect class="glow" width="1000" height="230" rx="16" fill="url(#gl)"/>
<rect width="1000" height="230" rx="16" fill="url(#grid)"/>
<text x="40" y="40" font-family="Consolas, 'SF Mono', Menlo, 'Liberation Mono', monospace" font-size="13" fill="#8f7fb8">experience · 2026</text>
<line x1="380.0" y1="60" x2="380.0" y2="204" stroke="#fff" stroke-opacity=".08"/><text x="380.0" y="220" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, 'Liberation Mono', monospace" font-size="11.5" fill="#8f7fb8">Jan</text><line x1="525.0" y1="60" x2="525.0" y2="204" stroke="#fff" stroke-opacity=".08"/><text x="525.0" y="220" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, 'Liberation Mono', monospace" font-size="11.5" fill="#8f7fb8">Feb</text><line x1="670.0" y1="60" x2="670.0" y2="204" stroke="#fff" stroke-opacity=".08"/><text x="670.0" y="220" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, 'Liberation Mono', monospace" font-size="11.5" fill="#8f7fb8">Mar</text><line x1="815.0" y1="60" x2="815.0" y2="204" stroke="#fff" stroke-opacity=".08"/><text x="815.0" y="220" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, 'Liberation Mono', monospace" font-size="11.5" fill="#8f7fb8">Apr</text><line x1="960.0" y1="60" x2="960.0" y2="204" stroke="#fff" stroke-opacity=".08"/><text x="960.0" y="220" text-anchor="middle" font-family="Consolas, 'SF Mono', Menlo, 'Liberation Mono', monospace" font-size="11.5" fill="#8f7fb8">May</text>

<text x="40" y="98" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#fff">The Build Fellowship</text>
<text x="40" y="120" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ff5fa2">Build Student Consultant</text>
