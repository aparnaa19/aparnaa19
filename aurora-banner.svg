<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240">
<style>
.b1 { animation: drift1 16s ease-in-out infinite alternate; }
.b2 { animation: drift2 19s ease-in-out infinite alternate; }
.b3 { animation: drift3 23s ease-in-out infinite alternate; }
@keyframes drift1 { from { transform: translate(-60px, 0) scale(1); } to { transform: translate(140px, 20px) scale(1.15); } }
@keyframes drift2 { from { transform: translate(80px, 10px); } to { transform: translate(-120px, -15px); } }
@keyframes drift3 { from { transform: translate(0, -10px) scale(1.1); } to { transform: translate(90px, 15px) scale(.9); } }
.w1 { animation: slide 14s linear infinite; }
.w2 { animation: slide 21s linear infinite reverse; }
@keyframes slide { from { transform: translateX(0); } to { transform: translateX(-1000px); } }
.tw { animation: tw 4s ease-in-out infinite; }
@keyframes tw { 0%,100% { opacity: .1; } 50% { opacity: .9; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
