<style>
.mover { animation: move 26s linear infinite; }
@keyframes move {
  0% { transform: translate(-110px, 4px); }
  42% { transform: translate(440px, 4px); }
  64% { transform: translate(440px, 4px); }
  100% { transform: translate(1010px, 4px); }
}
.walk { animation: walkvis 26s steps(1) infinite; }
@keyframes walkvis { 0% { opacity: 1; } 42% { opacity: 0; } 64% { opacity: 1; } }
.sit { opacity: 0; animation: sitvis 26s steps(1) infinite; }
@keyframes sitvis { 0% { opacity: 0; } 42% { opacity: 1; } 64% { opacity: 0; } }
.fa { animation: fa .44s steps(1) infinite; }
.fb { animation: fb .44s steps(1) infinite; }
@keyframes fa { 0% { opacity: 1; } 50% { opacity: 0; } }
@keyframes fb { 0% { opacity: 0; } 50% { opacity: 1; } }
.ta { animation: fa 1.1s steps(1) infinite; }
.tb { animation: fb 1.1s steps(1) infinite; }
.blink { opacity: 0; animation: blink 3.4s steps(1) infinite; }
@keyframes blink { 0% { opacity: 0; } 88% { opacity: 1; } 94% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
