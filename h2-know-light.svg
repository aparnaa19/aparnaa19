<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 50" width="880" height="50" role="img" aria-label="What I know"><style>@font-face { font-family: 'MD'; font-weight: 400; src: url(data:font/woff2;base64,) format('woff2'); }@font-face { font-family: 'MD'; font-weight: 600; src: url(data:font/woff2;base64,) format('woff2'); }text { font-family: 'MD', 'Noto Sans', 'Segoe UI', Helvetica, Arial, sans-serif; }
