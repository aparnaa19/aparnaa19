<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Hi, I'm Aparnaa Mahalaxmi Arulljothi. M.A.S. Cybersecurity, SOC Operations, SIEM Investigation, Threat Detection, Incident Response">
<style>
.scroll { animation: scroll 16s linear infinite; }
@keyframes scroll { to { transform: translateY(-266px); } }
.scan { animation: scan 6s linear infinite; }
@keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(360px); } }
.chip { opacity: 0; animation: chip .6s ease-out forwards; }
@keyframes chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.live { animation: live 1.4s ease-in-out infinite; }
@keyframes live { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
.caret { animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
.alert { opacity: 0; animation: alert 9s ease-in-out infinite; }
@keyframes alert { 0%,18% { opacity: 0; transform: translateY(10px); } 22%,52% { opacity: 1; transform: translateY(0); } 55%,100% { opacity: 0; } }
.ok { opacity: 0; animation: ok 9s ease-in-out infinite; }
@keyframes ok { 0%,53% { opacity: 0; } 57%,84% { opacity: 1; } 88%,100% { opacity: 0; } }
.pulse { animation: pulse 9s ease-out infinite; transform-origin: 776px 287px; }
@keyframes pulse { 0%,22% { opacity: 0; transform: scale(.6); } 26% { opacity: .7; } 40%,100% { opacity: 0; transform: scale(1.6); } }
.ring { animation: ring 4s ease-out infinite; transform-origin: 930px 40px; }
@keyframes ring { from { opacity: .5; transform: scale(.2); } to { opacity: 0; transform: scale(1); } }
.glow { animation: glow 6s ease-in-out infinite; }
@keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: .85; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
</style>
